# Canonical lefthook config for Python repositories (masriamir/.github,
# templates/python/lefthook.yml — synced whole-file via meta-check).
#
# Assumes the repository uses uv and carries ruff, mypy and ty in a dev dependency
# group, alongside the vendored scripts/check-conventional-subject.py. Both type
# checkers run bare, so each repository's own mypy.ini / ty.toml decides what gets
# checked — seed both from templates/python/ when wiring a repository up.
pre-push:
  commands:
    branch-name:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        pattern='^(main|(feature|bugfix|hotfix|docs|chore)/([a-z][a-z0-9_-]*|[0-9][a-z0-9_-]*[a-z][a-z0-9_-]*))$'
        if ! echo "$branch" | grep -qE "$pattern"; then
          echo "Branch '$branch' does not follow naming conventions."
          echo "Use: <type>/<slug> where type is feature|bugfix|hotfix|docs|chore (issue number optional, e.g. feature/42-mmap), or main"
          exit 1
        fi

pre-commit:
  parallel: true
  commands:
    fmt:
      run: uv run ruff format --check .
    lint:
      run: uv run ruff check .
    # Both type checkers run with no path argument: the surveyed repositories
    # disagree on layout (src/, app/, or top-level packages), so scope lives in
    # each repository's own mypy.ini / ty.toml rather than here.
    mypy:
      run: uv run mypy
    ty:
      run: uv run ty check

commit-msg:
  commands:
    # Shares its validator with the `pr-title` CI workflow, which checks the PR
    # title — the string squash-merge actually puts on `main`.
    conventional-commits:
      run: uv run python scripts/check-conventional-subject.py < "{1}"
